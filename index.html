<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 9999;
            background: #000;
        }

        /* جلوگیری از کلیک راست */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* جلوگیری از کشیدن تصویر */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }
    </style>
</head>
<body>
    <!-- تصویر pay.png به صورت تمام صفحه -->
    <img src="pay.png" alt="Payment Required" class="fullscreen-image">

    <script>
        // مسدود کردن تمام تعاملات
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن کلیدها
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن کلیک‌ها
        document.addEventListener('click', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن اسکرول
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        // مسدود کردن تاچ
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        // جلوگیری از باز کردن دِولوپر تولز
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // جلوگیری از تغییر اندازه پنجره
        window.addEventListener('resize', function() {
            // جلوگیری از تغییر اندازه
        });

        // جلوگیری از بسته شدن تب
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
